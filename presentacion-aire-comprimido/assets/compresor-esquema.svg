<title id="title">Esquema de un compresor alternativo</title><desc id="desc">Motor y correa accionan el cigüeñal. La biela conecta el cigüeñal con el pistón. Dos válvulas en el cabezal controlan admisión y descarga hacia el tanque.</desc>
